name: km-gestion-seguridad

networks:
  observability:
    external: true
    name: observability-network
  karma:
    external: true
    name: karma-network

services:
  gs-api:
    image: km-gs-api:latest
    container_name: km-gs-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7001:7001"
    networks:
      - observability
      - karma
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:7001
      - DataAccess__Esquema=nuc_core
      - ConnectionStrings__PostgreSql=Host=km-postgres-core;Port=5432;Database=Karma.Systems;Username=karma_admin;Password=${KARMA_POSTGRES_PASSWORD}
      - Jwt__Clave=${KARMA_JWT_CLAVE}
      - Jwt__Emisor=https://localhost:7001/
      - Jwt__Audiencias__0=https://localhost:9001
      - Jwt__Minutos=15
    restart: unless-stopped
