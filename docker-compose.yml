name: km-gestion-seguridad

networks:
  observability:
    external: true
    name: observability-network
  karma:
    external: true
    name: karma-network

services:
  gs-api:
    image: km-gs-api:latest
    container_name: km-gs-api
    build:
      context: .
      dockerfile: GS.Api/Dockerfile
    ports:
      - "7001:7001"
    networks:
      - observability
      - karma
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:7001
      - DataAccess__Provider=PostgreSql
      - SecurityBootstrap__AdminUser=${KARMA_BOOTSTRAP_ADMIN_USER:-}
      - SecurityBootstrap__AdminPassword=${KARMA_BOOTSTRAP_ADMIN_PASSWORD:-}
      - SecurityBootstrap__AdminName=${KARMA_BOOTSTRAP_ADMIN_NAME:-Administrador inicial}
      - ConnectionStrings__PostgreSql=Host=km-postgres-core;Port=5432;Database=Karma.Systems;Username=karma_admin;Password=${KARMA_POSTGRES_PASSWORD}
      - ConnectionStrings__cnSql=${KARMA_SQLSERVER_SECURITY:-}
    restart: unless-stopped
